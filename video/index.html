<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Просто Видео</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#0f1115; --panel:#171a20; --panel2:#1e222a; --line:#2a2f39; --fg:#ebe7df; --muted:#8c93a0;
  --accent:#ff8a2a; --accent2:#4fb3ff; --ok:#4cc38a; --bad:#e5604d; --r:12px;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--f-body);height:100%;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-height:32px;transition:background .15s,border-color .15s;white-space:nowrap}
button:hover{border-color:#3d4452}
button.on,button.primary{background:var(--accent);color:#1a0f04;border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
select,input[type=text],input[type=number],textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;min-height:32px}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=color]{width:42px;height:32px;padding:0;border:1px solid var(--line);border-radius:8px;background:none}
.mono{font-family:var(--f-mono)} .muted{color:var(--muted)} .hint{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.app{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto minmax(180px,38vh);gap:8px;padding:10px 12px}
header{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px}
.brand .dot{width:14px;height:14px;border-radius:4px;background:linear-gradient(135deg,#ffb36b,var(--accent) 55%,#c4520b);box-shadow:0 0 14px #ff8a2a88}
#prjName{width:240px;font-weight:600}
.main{display:grid;grid-template-columns:250px minmax(0,1fr) 290px;gap:8px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:0;min-width:0}
.bin{display:flex;flex-direction:column;gap:8px}
.binlist{flex:1;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start;min-height:60px}
.mi{background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:grab;position:relative}
.mi .th{height:58px;background:#0b0d11 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:22px}
.mi .nm{font-size:11px;padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .du{position:absolute;right:4px;top:40px;font-size:10px;background:#000a;border-radius:4px;padding:0 4px;font-family:var(--f-mono)}
.mi.used{border-color:#4a3a28}
.mi.bsel{outline:2px solid var(--accent2);outline-offset:-1px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:12px;text-align:center;color:var(--muted);font-size:12px}
.drop.over,.binlist.over{border-color:var(--accent);background:#ff8a2a14}
.stage{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-height:0;overflow:hidden}
.main>*{min-height:0}
.view{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#08090c;border-radius:10px;overflow:hidden;position:relative}
#pv{max-width:100%;max-height:100%;background:#000;box-shadow:0 0 0 1px #222}
.transport{display:flex;align-items:center;gap:6px;justify-content:center}
.clock{font-family:var(--f-mono);font-size:15px;min-width:150px;text-align:center}
.insp{overflow:auto;display:flex;flex-direction:column;gap:8px}
.insp h3{margin:0;font-size:14px}
.f{display:grid;grid-template-columns:105px minmax(0,1fr) auto;gap:6px;align-items:center;font-size:13px}
.f>span:first-child{color:var(--muted)}
.f input[type=number]{width:72px}
.sec{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
textarea#txText{width:100%;min-height:64px;resize:vertical}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tools .sp{flex:1}
.tl{position:relative;overflow:hidden;display:grid;grid-template-columns:96px minmax(0,1fr);grid-template-rows:24px minmax(0,1fr);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-height:0}
.tlcorner{border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.ruler{position:relative;border-bottom:1px solid var(--line);overflow:hidden;cursor:pointer;user-select:none}
.ruler canvas{position:absolute;left:0;top:0;height:24px}
.heads{border-right:1px solid var(--line);overflow:hidden}
.th2{display:flex;align-items:center;padding:0 8px;font-size:12px;color:var(--muted);border-bottom:1px solid #20242c;gap:4px}
.lanes{position:relative;overflow:auto}
.lanesIn{position:relative}
.lane{position:relative;border-bottom:1px solid #20242c}
.lane.over{background:#ff8a2a10}
.clip{position:absolute;top:3px;bottom:3px;border-radius:6px;overflow:hidden;cursor:grab;border:1px solid #0006;font-size:11px;color:#fff;user-select:none;background-repeat:repeat-x;background-size:auto 100%}
.clip .lb{position:absolute;left:4px;top:2px;right:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000;pointer-events:none}
.clip.v{background-color:#2b4a78}.clip.i{background-color:#4a3b78}.clip.a{background-color:#1f5a4a}.clip.t{background-color:#7a4b1f}
.clip.sel{outline:2px solid var(--accent);outline-offset:-1px;z-index:2}
.clip .h{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:3}
.clip .h.l{left:0}.clip .h.r{right:0}
.clip .h:hover{background:#fff4}
.clip .tr{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#fff5,#fff0);pointer-events:none}
.clip .fx{position:absolute;right:4px;bottom:2px;font-size:10px;background:#0008;border-radius:4px;padding:0 3px;pointer-events:none}
.kfd{position:absolute;bottom:3px;width:8px;height:8px;background:#ffd34d;transform:rotate(45deg);border:1px solid #0008;pointer-events:none}
button.kfb.on{background:#ffd34d;border-color:#ffd34d;color:#111}
.mkl{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed #ffd34d88;pointer-events:none;z-index:1}
.ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none;z-index:5;box-shadow:0 0 4px #000}
.snapln{position:absolute;top:0;bottom:0;width:1px;background:var(--accent2);pointer-events:none;z-index:4}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(560px,94vw);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.mbox h2{margin:0;font-size:17px}
.prj{display:flex;align-items:center;gap:8px;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}
.bar{height:10px;border-radius:6px;background:var(--panel2);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1b1f27;border:1px solid #3a3f4a;border-radius:10px;padding:9px 14px;z-index:60;max-width:80vw;box-shadow:0 6px 24px #0008}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
#hold{position:fixed;left:-10px;top:-10px;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
@media (max-width:1100px){.main{grid-template-columns:200px minmax(0,1fr) 250px}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<div class="app">
<header>
  <div class="row"><div class="brand"><span class="dot"></span>Просто Видео <span class="muted mono" style="font-size:11px;font-weight:400">в.1.5</span></div>
    <input id="prjName" type="text" title="Название проекта"></div>
  <div class="row">
    <button id="bProjects">📁 Проекты</button>
    <button id="bNew">＋ Новый</button>
    <select id="aspect" title="Формат кадра"><option value="16:9">16:9 — экран, YouTube</option><option value="9:16">9:16 — Reels, TikTok</option><option value="1:1">1:1 — квадрат</option><option value="4:3">4:3</option></select>
    <select id="fps" title="Кадров в секунду"><option>25</option><option selected>30</option><option>60</option></select>
    <button id="bExport" class="primary">⬇ Сохранить видео</button>
  </div>
</header>

<div class="main">
  <section class="panel bin">
    <div class="row" style="justify-content:space-between"><b>Файлы</b><span class="row" style="gap:4px"><button id="bOver" title="Положить выбранный файл поверх основного видео в месте курсора">▣ Поверх</button><button id="bFromZvuk" title="Взять песню из плейлиста «Просто Звук»">🎵 Из Звука</button><button id="bAdd">＋ Добавить</button></span><input id="fileIn" type="file" multiple accept="video/*,audio/*,image/*" hidden></div>
    <div class="drop" id="binDrop">Перетащите сюда видео, фото и музыку. Потом — на дорожки внизу или двойной щелчок.</div>
    <div class="binlist" id="binList"></div>
  </section>
  <section class="stage">
    <div class="view" id="view"><canvas id="pv" width="960" height="540"></canvas></div>
    <div class="transport">
      <button id="bHome" title="В начало (Home)">⏮</button>
      <button id="bBack" title="Кадр назад (←)">◀︎</button>
      <button id="bPlay" class="primary" title="Играть / пауза (пробел)" style="min-width:56px">▶</button>
      <button id="bFwd" title="Кадр вперёд (→)">▶︎</button>
      <button id="bEnd" title="В конец (End)">⏭</button>
      <span class="clock" id="clock">00:00.00 / 00:00.00</span>
      <button id="bFull" title="Просмотр на весь экран">⛶</button>
    </div>
  </section>
  <section class="panel insp" id="insp"></section>
</div>

<div class="tools">
  <button id="bSplit" title="Разрезать в месте курсора (S)">✂ Разрезать</button>
  <button id="bDel" title="Удалить выбранное (Delete)">🗑 Удалить</button>
  <button id="bDup" title="Повторить клип (Ctrl+D)">⧉ Копия</button>
  <button id="bText" title="Добавить надпись в месте курсора">T ＋ Текст</button>
  <button id="bUndo" title="Отменить (Ctrl+Z)">↶</button><button id="bRedo" title="Вернуть (Ctrl+Shift+Z)">↷</button>
  <button id="bRec" title="Записать голос с микрофона в месте курсора">🎙 Голос</button>
  <button id="bSubs" title="Субтитры из речи">💬 Субтитры</button><button id="bSubStyle" title="Стиль выбранной подписи — всем субтитрам">Стиль всем</button>
  <button id="bDuck" title="Музыка сама становится тише, когда в клипах говорят или поют">🔉 Тише под голос</button>
  <button id="bBeats" title="Найти доли в музыке и поставить метки">🎵 Доли</button><button id="bCutMarks" title="Разрезать выбранный клип по меткам">✂ По меткам</button><button id="bMarkClr" title="Убрать все метки (M — поставить метку)">⌫ Метки</button>
  <button id="bStill" title="Вырезать места, где в кадре ничего не происходит">✂ Без движения</button>
  <button id="bAuto" class="primary" title="Автомонтаж: из пачки видео по образцу">✨ Автомонтаж</button>
  <button id="bMagnet" class="on" title="Основная дорожка без пропусков: клипы сами встают встык">🧲 Встык</button>
  <span class="sp"></span>
  <span class="hint">Масштаб</span><input id="zoom" type="range" min="0" max="100" value="40" style="width:140px">
  <button id="bFit" title="Показать всё">⇔</button>
</div>

<section class="tl" id="tl">
  <div class="tlcorner"></div>
  <div class="ruler" id="ruler"><canvas id="rulerC"></canvas></div>
  <div class="heads" id="heads"></div>
  <div class="lanes" id="lanes"><div class="lanesIn" id="lanesIn"></div></div>
</section>
</div>

<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div id="toast" class="toast" hidden></div>
<div id="hold"></div>

  return `<label class="f"><span>${lbl}</span><input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${v}"><span class="row" style="gap:3px;flex-wrap:nowrap"><input type="number" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${+(+v).toFixed(2)}" style="width:62px"><button class="kfb${on?' on':''}" data-kf="${k}" title="${on?'Убрать ключевой кадр':'Поставить ключевой кадр в месте курсора'}${has?' · свойство анимировано':''}" style="min-height:26px;padding:0 6px">${on?'◆':has?'◈':'◇'}</button></span></label>` }

      ${F.mask?sl('Центр X, %','mx',0,100,.5)+sl('Центр Y, %','my',0,100,.5)+(F.mask!=='band'?sl('Ширина, %','mw',2,150,.5):'')+sl('Высота, %','mh',2,150,.5)+sl('Мягкий край','mf',0,60,1)+`<label class="f"><span></span><label class="row hint"><input type="checkbox" data-k="fx.minv" ${F.minv?'checked':''}> наоборот (вырезать)</label><span></span></label>`:''}</div>

  h+=`<div class="sec row"><button id="iSplit">✂ Разрезать здесь</button><button id="iDel">🗑 Удалить</button></div>`;
  box.innerHTML=h;
  const setv=(k,v)=>{ const c=selClip(); if(!c) return; if(k.startsWith('fx.')){ c.fx=c.fx||FX0(); c.fx[k.slice(3)]=v; return ['preset','key','mask'].includes(k.slice(3))?true:undefined }
    if(ANIM.includes(k)&&c.kf&&c.kf[k]&&c.kf[k].length){ const t=nowT(); if(t>=c.start&&t<=endOf(c)){ kfSet(c,k,t-c.start,v); return } } if(k==='trType'){ c.trans=v?{type:v,dur:c.trans&&c.trans.dur||.6}:null; return true } if(k==='trDur'){ if(c.trans) c.trans.dur=v; return }
    if(k==='speed'){ const keep=c.dur*c.speed; c.speed=clamp(v,.1,8); c.dur=Math.min(keep/c.speed,maxDur(c)); return 'pack' } if(k==='dur'){ c.dur=clamp(v,.1,c.media?maxDur(c):3600); return 'pack' } c[k]=v };
  box.querySelectorAll('[data-k]').forEach(inp=>{ const k=inp.dataset.k; const ev=inp.type==='range'||inp.tagName==='TEXTAREA'||inp.type==='color'?'input':'change';
    inp.addEventListener(ev,()=>{ let v=inp.type==='checkbox'?inp.checked:inp.type==='range'||inp.type==='number'?parseFloat(inp.value):inp.value; if(typeof v==='number'&&isNaN(v)) return;

  const kn=dir=>{ const c=selClip(), T=kfTimes(c).map(x=>x+c.start), t=nowT(); const x=dir<0?T.filter(v=>v<t-1e-3).pop():T.find(v=>v>t+1e-3); if(x==null) return toast('Ключевых кадров больше нет.'); seek(x) };

let PICK=null, inspT=0;
function inspSoon(){ clearTimeout(inspT); inspT=setTimeout(()=>{ if(!PB.playing&&!document.activeElement.closest?.('#insp')) renderInsp() },140) }
$('#pv').addEventListener('click',e=>{ if(!PICK) return; const c=PRJ.clips.find(x=>x.id===PICK); PICK=null; if(!c) return; const r=$('#pv').getBoundingClientRect(), x=Math.round((e.clientX-r.left)/r.width*pv.width), y=Math.round((e.clientY-r.top)/r.height*pv.height);
  c.fx=c.fx||FX0(); const was=c.fx.key; c.fx.key=false; paint(PB.t); setTimeout(()=>{ const d=pg.getImageData(x,y,1,1).data; c.fx.kcol='#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join(''); c.fx.key=true; commit(); toast('Цвет фона взят: '+c.fx.kcol) },120) });

// ---------- сохранение готового видео ----------
const Q={'720':720,'1080':1080,'2160':2160};
function outSize(q){ const s=Q[q]||1080, k=s/Math.min(PRJ.w,PRJ.h); let w=Math.round(PRJ.w*k/2)*2, h=Math.round(PRJ.h*k/2)*2; return [w,h] }
async function pickCodec(w,h,fps,br){ const C=[['avc1.640033','avc'],['avc1.640028','avc'],['avc1.4d0028','avc'],['avc1.42E028','avc'],['vp09.00.40.08','vp9'],['vp8','vp9']];
  if(!window.VideoEncoder) return null;
  for(const [codec,mux] of C){ const cfg={codec,width:w,height:h,bitrate:br,framerate:fps}; if(mux==='avc') cfg.avc={format:'avc'}; if(codec==='vp8'){ continue } try{ const r=await VideoEncoder.isConfigSupported(cfg); if(r.supported) return {cfg,mux} }catch(e){} } return null }
async function pickAudio(){ if(!window.AudioEncoder) return null; for(const [codec,mux] of [['mp4a.40.2','aac'],['opus','opus']]){ const cfg={codec,sampleRate:48000,numberOfChannels:2,bitrate:192000}; try{ const r=await AudioEncoder.isConfigSupported(cfg); if(r.supported) return {cfg,mux} }catch(e){} } return null }
async function mixAudio(D){ const clips=PRJ.clips.filter(c=>{ const m=M(c.media); return m&&!c.mute&&c.vol>0&&(m.kind==='audio'||(m.kind==='video'&&m.hasAudio!==false)) }); if(!clips.length) return null;
  const sr=48000, oc=new OfflineAudioContext(2,Math.max(1,Math.ceil(D*sr)),sr); let any=false;
  let duckN=null; if(PRJ.duck&&PRJ.duck.on){ if(!DUCK.segs) DUCK.segs=await voiceSegs(); if(DUCK.segs.length){ duckN=oc.createGain(); duckN.connect(oc.destination); const g=Math.pow(10,(PRJ.duck.db||-12)/20); duckN.gain.setValueAtTime(1,0); for(const [a,b] of DUCK.segs){ duckN.gain.setValueAtTime(1,Math.max(0,a-.15)); duckN.gain.linearRampToValueAtTime(g,Math.max(0,a)); duckN.gain.setValueAtTime(g,b); duckN.gain.linearRampToValueAtTime(1,b+.45) } } }
  for(const c of clips){ const b=await audioBuf(c.media); if(!b) continue; any=true; const ext=extOf(c), len=c.dur+ext, s=oc.createBufferSource(); s.buffer=b; s.playbackRate.value=c.speed; const g=oc.createGain(), v=c.vol/100, fi=Math.max(c.fadeIn||0,c.trans&&c.trans.type?c.trans.dur:0), fo=ext>0?ext:(c.fadeOut||0);
    g.gain.setValueAtTime(fi>0?0:v,c.start); if(fi>0) g.gain.linearRampToValueAtTime(v,c.start+Math.min(fi,len/2)); if(fo>0){ g.gain.setValueAtTime(v,Math.max(c.start+fi,c.start+len-fo)); g.gain.linearRampToValueAtTime(0,c.start+len) }

async function renderMp4(q,name,handle,onp,stopped){ const fps=PRJ.fps, D=prjDur(), [w,h]=outSize(q), br=q==='2160'?36e6:q==='1080'?12e6:6e6;

  try{
    for(let i=0;i<N;i++){ if(stopped()) { ve.close(); if(stream) await stream.abort().catch(()=>{}); return null } if(err) throw err; const t=i/fps;
      const need=mediaClipsAt(t); for(const c of need){ const e=await xel(c); await seekEl(e,srcT(c,t)) } for(const [id,e] of XE) if(!need.some(c=>c.id===id)&&!PRJ.clips.some(c=>c.id===id&&t<endOf(c)+3)){ e.removeAttribute('src'); e.load(); e.remove(); XE.delete(id) }

async function voiceSegs(){ const src=PRJ.clips.filter(c=>{ const m=M(c.media); return m&&!c.mute&&c.vol>0&&c.track!=='a1'&&(m.kind==='audio'||(m.kind==='video'&&m.hasAudio!==false)) }); const segs=[];

async function beatsOf(c){ const b=await audioBuf(c.media); if(!b) return {beats:[]}; const sr=b.sampleRate, d=b.getChannelData(0), H=Math.round(sr*.01), env=[]; let prev=0;

        $('#amTxt').textContent=`Готово: ${r.n} кадров, ${fmtS(r.T)}${r.beats?', склейки на долях музыки':''}. Не нравится — «🔀 Другой вариант» или Ctrl+Z.`; $('#amAgain').hidden=false; toast('Автомонтаж готов.') } }
    catch(e){ UNDO.pop(); $('#amTxt').textContent='Не получилось: '+e.message }
    busy=false; $('#amGo').disabled=$('#amAgain').disabled=false; $('#amClose').textContent='Закрыть' };
  $('#amGo').onclick=()=>{ seed=1; run() }; $('#amAgain').onclick=()=>{ seed=2+Math.floor(Math.random()*1e6); run() } };

// ---------- вырезать моменты без движения ----------
function stillPlan(c,an,o){ const fps=an.fps, d=an.diff, n=d.length, a0=c.in, a1=c.in+c.dur*c.speed; const srt=[...d.slice(1)].sort((x,y)=>x-y), p10=srt[Math.floor(srt.length*.1)]||0;
  const thr=Math.max(.4,p10*1.2+.15)*Math.pow(1.35,o.sens-5), A=an.aud||[], aSrt=[...A].sort((x,y)=>x-y), aThr=A.length?Math.max(.02,(aSrt[Math.floor(A.length*.5)]||0)*1.6):1e9;
  const live=new Uint8Array(n); for(let i=1;i<n;i++) live[i]=(d[i]>thr||(o.sound&&A[i]>aThr))?1:0; live[0]=live[1]||0;
  // небольшие запасы вокруг движения, чтобы не резать впритык
  const m=Math.round(o.margin*fps), keep=new Uint8Array(n); for(let i=0;i<n;i++) if(live[i]) for(let j=Math.max(0,i-m);j<=Math.min(n-1,i+m);j++) keep[j]=1;
  const cuts=[]; let s=-1; for(let i=0;i<=n;i++){ const t=i/fps; const still=i<n&&!keep[i]&&t>=a0&&t<a1; if(still&&s<0) s=t; if(!still&&s>=0){ const e=Math.min(a1,t); if(e-s>=o.min) cuts.push([s,e]); s=-1 } }
  const kept=[]; let p=a0; for(const [x,y] of cuts){ if(x-p>.15) kept.push([p,x]); p=y } if(a1-p>.15) kept.push([p,a1]); return {cuts,kept,removed:cuts.reduce((q,[x,y])=>q+y-x,0)/c.speed} }
$('#bStill').onclick=async()=>{ let list=selClip()?[selClip()]:onTrack('v1'); list=list.filter(c=>c.media&&M(c.media)&&M(c.media).kind==='video'); if(!list.length) return toast('Выберите видео-клип (или положите видео на «Видео 1»).');
  const box=$('#mbox'); box.innerHTML=`<h2>✂ Убрать моменты без движения</h2><div class="hint">${list.length===1?'Клип «'+esc(M(list[0].media).name)+'»':'Все видео на «Видео 1» ('+list.length+')'}: программа найдёт места, где в кадре ничего не происходит, и вырежет их. Остальное встанет встык.</div>
    ${fNum('Чувствительность','sens',5,1,10,1)}<div class="hint">Больше — режет смелее (даже когда движение слабое), меньше — оставляет больше.</div>
    ${fNum('Пауза от, с','min',1.5,.3,10,.1)}${fNum('Запас, с','margin',.3,0,2,.05)}
    <label class="row hint"><input type="checkbox" id="stSnd" checked> не резать, где громко звучит голос или звук</label>
    <div class="bar"><i id="stBar"></i></div><div class="hint" id="stTxt">Смотрю видео…</div>
    <div class="row"><button class="primary" id="stGo" disabled>Вырезать</button><button id="stClose">Закрыть</button></div>`;
  $('#modal').hidden=false; let stop=false; $('#stClose').onclick=()=>{ stop=true; $('#modal').hidden=true };
  const O={sens:5,min:1.5,margin:.3,sound:true}; const ANs=[];
  for(let i=0;i<list.length;i++){ const m=M(list[i].media); const an=await analyze(m,4,p=>{ $('#stBar').style.width=((i+p)/list.length*100).toFixed(0)+'%' },()=>stop); if(stop) return; ANs.push(an) } $('#stBar').style.width='100%';
  const upd=()=>{ let n=0, sec=0; list.forEach((c,i)=>{ const r=stillPlan(c,ANs[i],O); n+=r.cuts.length; sec+=r.removed }); $('#stTxt').textContent=n?`Найдено мест без движения: ${n}, всего ${sec.toFixed(1)} с. Ролик станет короче на это время.`:'Мест без движения не нашлось — попробуйте увеличить чувствительность или уменьшить «Пауза от».'; $('#stGo').disabled=!n };
  box.querySelectorAll('[data-k]').forEach(inp=>inp.addEventListener('input',()=>{ const v=parseFloat(inp.value); if(isNaN(v)) return; O[inp.dataset.k]=v; box.querySelectorAll(`[data-k="${inp.dataset.k}"]`).forEach(o=>{ if(o!==inp) o.value=v }); upd() }));
  $('#stSnd').onchange=e=>{ O.sound=e.target.checked; upd() }; upd();
  $('#stGo').onclick=()=>{ let total=0; list.forEach((c,i)=>{ const r=stillPlan(c,ANs[i],O); if(!r.cuts.length) return; total+=r.cuts.length; const parts=r.kept.map((k,j)=>{ const x=JSON.parse(JSON.stringify(c)); x.id=j?uid():c.id; x.in=k[0]; x.dur=(k[1]-k[0])/c.speed; if(j) x.trans=null; if(j<r.kept.length-1) x.fadeOut=0; if(j) x.fadeIn=0; return x });
      PRJ.clips=PRJ.clips.filter(x=>x!==c); let at=c.start; for(const x of parts){ x.start=at; at+=x.dur; PRJ.clips.push(x) } if(c.track!=='v1'||!MAG){ const sh=c.dur-(at-c.start); for(const x of PRJ.clips) if(x.track===c.track&&x.start>=c.start+c.dur-1e-6&&!parts.includes(x)) x.start-=sh } resolve(c.track) });
    commit(); $('#modal').hidden=true; toast(`Вырезано мест без движения: ${total}. Не понравилось — Ctrl+Z.`,6000) } };

// ---------- проекты ----------
async function openPrj(p){ pause(); for(const e of EL.values()){ e.pause(); e.removeAttribute('src'); e.load(); e.remove() } EL.clear(); ABUF.clear();
  for(const r of MED.values()) URL.revokeObjectURL(r.url); MED.clear(); PRJ=p; SEL=null; UNDO.length=REDO.length=0; PB.t=0;
  $('#prjName').value=PRJ.name; $('#aspect').value=PRJ.aspect; $('#fps').value=String(PRJ.fps); await loadPrjMedia(); for(const m of PRJ.media) if(m.kind!=='image'&&m.hasAudio==null){ m.hasAudio=!!(await audioBuf(m.id)) }
  DUCK.segs=null; $('#bDuck').classList.toggle('on',!!(PRJ.duck&&PRJ.duck.on)); if(PRJ.duck&&PRJ.duck.on) duckRefresh();
  lastSnap=snap(); fitPv(); renderTL(); renderInsp(); requestDraw(); localStorage.setItem(KEY+'-last',PRJ.id); const miss=PRJ.media.filter(m=>m.missing).length; if(miss) toast('Не найдено файлов: '+miss+'. Добавьте их заново.',6000) }
$('#prjName').onchange=e=>{ PRJ.name=e.target.value.trim()||'Видео'; save() };
$('#aspect').onchange=e=>{ const [w,h]=ASPECTS[e.target.value]; PRJ.aspect=e.target.value; PRJ.w=w; PRJ.h=h; fitPv(); save(); requestDraw(); renderInsp(); toast('Формат кадра: '+PRJ.aspect+'. Клипы сами впишутся — подвиньте масштаб, если нужно.') };
$('#fps').onchange=e=>{ PRJ.fps=+e.target.value; save(); renderInsp() };
$('#bNew').onclick=async()=>{ await IDB.set('p:'+PRJ.id,PRJ); const p=newPrj($('#aspect').value); await openPrj(p); save(); toast('Новый проект. Старый сохранён — он в «📁 Проекты».') };
$('#bProjects').onclick=async()=>{ const L=(await IDB.get('plist'))||[], box=$('#mbox');
  box.innerHTML=`<h2>Проекты</h2>${L.map(x=>`<div class="prj"><div><b>${esc(x.name)}</b><div class="hint">${x.aspect||''} · ${fmtS(x.dur||0)} · ${new Date(x.saved||0).toLocaleString('ru',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div></div><div class="row"><button data-op="${x.id}" ${x.id===PRJ.id?'disabled':''}>${x.id===PRJ.id?'открыт':'Открыть'}</button><button data-dp="${x.id}" title="Удалить проект">🗑</button></div></div>`).join('')||'<div class="hint">Пока нет сохранённых проектов.</div>'}<div class="row"><button id="mClose">Закрыть</button></div>`;
  $('#modal').hidden=false; $('#mClose').onclick=()=>$('#modal').hidden=true;
  box.querySelectorAll('[data-op]').forEach(b=>b.onclick=async()=>{ const p=await IDB.get('p:'+b.dataset.op); if(!p) return toast('Проект не найден.'); $('#modal').hidden=true; await openPrj(p) });
  box.querySelectorAll('[data-dp]').forEach(b=>b.onclick=async()=>{ const id=b.dataset.dp; const x=L.find(y=>y.id===id); if(!confirm('Удалить проект «'+x.name+'»? Файлы, которые нужны только ему, тоже удалятся.')) return;
    const p=await IDB.get('p:'+id); const others=[]; for(const y of L) if(y.id!==id){ const q=y.id===PRJ.id?PRJ:await IDB.get('p:'+y.id); if(q) others.push(...q.media.map(m=>m.id)) } if(p) for(const m of p.media) if(!others.includes(m.id)) await IDB.del('f:'+m.id);
    await IDB.del('p:'+id); await IDB.set('plist',L.filter(y=>y.id!==id)); if(id===PRJ.id){ await openPrj(newPrj('16:9')); save() } $('#bProjects').click() }) };
$('#modal').onclick=e=>{ if(e.target.id==='modal'&&!$('#exGo')) $('#modal').hidden=true };
// файлы
$('#bAdd').onclick=()=>$('#fileIn').click();
window.BSEL=null; $('#binList').addEventListener('click',e=>{ const mi=e.target.closest('.mi'); if(!mi) return; window.BSEL=mi.dataset.m; $$('.mi.bsel').forEach(x=>x.classList.remove('bsel')); mi.classList.add('bsel') });
$('#bOver').onclick=()=>{ const m=window.BSEL&&M(window.BSEL); if(!m) return toast('Щёлкните по файлу слева (например, по рекламному ролику), поставьте курсор на нужный момент и нажмите «▣ Поверх».',7000); const t=nowT();
  let c; if(m.kind==='audio'){ c=clipFromMedia(m,'a2',t) } else { const tid=OVR.find(x=>freeOn(x,t,t+(m.kind==='image'?4:m.dur)))||'v2'; c=clipFromMedia(m,tid,t); c.muteUnder=m.kind==='video' } PRJ.clips.push(c); placeFree(c); SEL=c.id; commit(); toast(`«${m.name}» поверх с ${fmtS(c.start)}. Звук основного видео на это время приглушён — можно выключить справа.`,6000) };
$('#fileIn').onchange=async e=>{ await addMedia(e.target.files); e.target.value='' };
for(const el of [$('#binDrop'),$('#binList')]){ el.addEventListener('dragover',e=>{ if([...e.dataTransfer.types].includes('Files')){ e.preventDefault(); el.classList.add('over') } }); el.addEventListener('dragleave',()=>el.classList.remove('over')); el.addEventListener('drop',async e=>{ el.classList.remove('over'); if(!e.dataTransfer.files.length) return; e.preventDefault(); e.stopPropagation(); await addMedia(e.dataTransfer.files) }) }
document.addEventListener('dragover',e=>{ if([...e.dataTransfer.types].includes('Files')) e.preventDefault() });
document.addEventListener('drop',async e=>{ if(e.dataTransfer.files.length){ e.preventDefault(); await addMedia(e.dataTransfer.files) } });
// управление
$('#bPlay').onclick=()=>PB.playing?pause():play();
$('#bHome').onclick=()=>seek(0); $('#bEnd').onclick=()=>seek(prjDur());
$('#bBack').onclick=()=>seek(nowT()-1/PRJ.fps); $('#bFwd').onclick=()=>seek(nowT()+1/PRJ.fps);
$('#bExport').onclick=exportDlg;
$('#bFull').onclick=()=>{ const v=$('#view'); document.fullscreenElement?document.exitFullscreen():v.requestFullscreen&&v.requestFullscreen() };
document.addEventListener('fullscreenchange',()=>setTimeout(fitPv,50));
document.addEventListener('keydown',e=>{ if(e.target.matches('input,textarea,select')) return; const k=e.key, ctrl=e.ctrlKey||e.metaKey;
  if(e.code==='Space'){ e.preventDefault(); $('#bPlay').click() }
  else if((e.code==='KeyS')&&!ctrl){ e.preventDefault(); $('#bSplit').click() }
  else if(k==='Delete'||k==='Backspace'){ e.preventDefault(); $('#bDel').click() }
  else if(ctrl&&e.code==='KeyZ'){ e.preventDefault(); e.shiftKey?redo():undo() }
  else if(ctrl&&e.code==='KeyY'){ e.preventDefault(); redo() }
  else if(ctrl&&e.code==='KeyD'){ e.preventDefault(); $('#bDup').click() }
  else if(k==='ArrowLeft'){ e.preventDefault(); seek(nowT()-(e.shiftKey?1:1/PRJ.fps)) }
  else if(k==='ArrowRight'){ e.preventDefault(); seek(nowT()+(e.shiftKey?1:1/PRJ.fps)) }
  else if(k==='Home'){ seek(0) } else if(k==='End'){ seek(prjDur()) }
  else if(e.code==='KeyM'&&!ctrl){ const t=Math.round(nowT()*1000)/1000; if(!marks().includes(t)){ marks().push(t); marks().sort((a,b)=>a-b); save(); drawMarksTL(); toast('Метка поставлена. Клипы будут к ней прилипать.') } }
  else if(k==='Escape'){ SEL=null; renderTL(); renderInsp() } });
new ResizeObserver(()=>{ if(PRJ){ fitPv(); drawRuler(); requestDraw() } }).observe($('#view'));
// старт
(async()=>{ MAG=localStorage.getItem(KEY+'-mag')!=='0'; $('#bMagnet').classList.toggle('on',MAG); Z=zFromSlider(+$('#zoom').value);
  let p=null; try{ const id=localStorage.getItem(KEY+'-last'); if(id) p=await IDB.get('p:'+id) }catch(e){}
  await openPrj(p||newPrj('16:9')); if(!p) save() })();

<div id="pwaUpd" style="display:none;position:fixed;right:16px;bottom:16px;z-index:2147483647;background:#1b1f27;color:#e8ecf2;border:1px solid #ff9b45;border-radius:12px;padding:12px 14px;font:14px system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:340px">
<b>Вышла новая версия</b><div style="opacity:.75;margin:4px 0 10px">Обновите, когда не идёт спектакль — программа перезапустится.</div>
<button id="pwaGo" style="background:#ff9b45;color:#111;border:0;border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer">Обновить</button>

<script>
(function(){ if(!('serviceWorker' in navigator)||location.protocol!=='https:'&&location.hostname!=='localhost') return;
  try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist() }catch(e){}
  var box=document.getElementById('pwaUpd'), wk=null, go=false, nt=0;
  function note(t){ var n=document.getElementById('pwaNote'); if(!n){ n=document.createElement('div'); n.id='pwaNote'; n.style.cssText='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:2147483647;background:#1b1f27;color:#e8ecf2;border:1px solid #444;border-radius:10px;padding:9px 14px;font:14px system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.5)'; document.body.appendChild(n) } n.textContent=t; n.style.display='block'; clearTimeout(nt); nt=setTimeout(function(){ n.style.display='none' },3500) }
  function show(w){ wk=w; box.style.display='block' }
  document.getElementById('pwaGo').onclick=function(){ go=true; box.style.display='none'; if(wk) wk.postMessage('skip') };
  document.getElementById('pwaLater').onclick=function(){ box.style.display='none' };
  navigator.serviceWorker.addEventListener('controllerchange',function(){ if(go){ go=false; location.reload() } });
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(reg){
    var chk=function(manual){ if(!navigator.onLine){ if(manual) note('Нет интернета — проверю, когда появится.'); return } reg.update().then(function(){ if(manual&&!reg.installing&&!reg.waiting) note('Обновлений нет — у вас последняя версия.') }).catch(function(){ if(manual) note('Не получилось проверить — нет связи с сайтом.') }) };
    window.pwaCheck=chk; window.addEventListener('online',function(){ chk() }); window.addEventListener('focus',function(){ chk() });
    var v=[].slice.call(document.querySelectorAll('header span, .brand span')).find(function(e){ return /^\s*в\.\d/.test(e.textContent) }); if(v){ v.style.cursor='pointer'; v.title='Нажмите — проверить обновления'; v.addEventListener('click',function(){ note('Проверяю обновления…'); chk(true) }) }
    if(reg.waiting&&navigator.serviceWorker.controller) show(reg.waiting);
    reg.addEventListener('updatefound',function(){ var w=reg.installing; w&&w.addEventListener('statechange',function(){ if(w.state==='installed'&&navigator.serviceWorker.controller) show(w) }) });
    setInterval(function(){ chk() },2*60*1000);
    document.addEventListener('visibilitychange',function(){ if(!document.hidden) chk() });
  }).catch(function(){});
})();
